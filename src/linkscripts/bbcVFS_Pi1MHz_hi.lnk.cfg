MEMORY {
    # code must stay below the workspace: GXR &BB00, text buffer &BC00, private &BD00-&BFFF
    ROM: 		    start = $8000, size = $3B00, file = %O, fill=yes, fillval=$00;
    GXRWK:		    start = $BB00, size = $0100, file = %O, fill=yes, fillval=$00;
    WKSP:		    start = $BC00, size = $0400, file = %O, fill=yes, fillval=$00;
}
SEGMENTS {
    rom_header:                 load = ROM, type = ro;
    vfs_far:                    load = ROM, type = ro, start = $8040;
    vfs_far_code:               load = ROM, type = ro;
    vfs_upper:                  load = ROM, type = ro;
    vfs_mouse:                  load = ROM, type = ro;
    vfs_tubehost:               load = ROM, type = ro, optional = yes;
    vfs_gxr:                    load = ROM, type = ro, optional = yes;
}
FEATURES {
}
SYMBOLS {
}
